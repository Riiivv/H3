<div class="search-box">
  <span class="search-icon">🔍</span>
  <input type="text" placeholder="search for movie...">
</div>

<div class="genre-dropdown">
  <button class="dropdown-trigger" (click)="isGenreOpen = !isGenreOpen">
    {{ activeGenre || 'Choose Genre' }} ▼
  </button>

  <div class="dropdown-menu" *ngIf="isGenreOpen">
    <button class="dropdown-item" *ngFor="let g of genres"
    (click)="selectGenre(g)"
    [class.active]="g === activeGenre">
      {{ g }}
    </button>
    </div>
</div>

<div class="film-grid">
  <div class="film-card" *ngFor="let film of filteredFilms">
    <img [src]="film.imageUrl">
    <div class="rating">{{ film.rating }}</div>
  </div>
</div>

<div class="film-grid">
  <div class="film-card" *ngFor="let film of filteredFilms">
    <!-- midlertidigt tekst, indtil du har billeder -->
    <h3>{{ film.Title }}</h3>
    <p>{{ film.Genre }} • {{ film.ReleaseYear }}</p>
  </div>
</div>
